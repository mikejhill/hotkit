name: Mutation tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      max:
        description: Number of mutants to sample (0 = all)
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  AHK_VERSION: "2.0.30"
  AHK_SHA256: "1e0ece7ecb2d5646e55758150472677996a57f9db5c83d2996d8b47b9e2f31a4"

jobs:
  mutation:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install AutoHotkey ${{ env.AHK_VERSION }}
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ahk.zip"
          Invoke-WebRequest "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:AHK_SHA256) { throw "AutoHotkey checksum mismatch: $hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\ahk"
          "AHK_EXE=$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" >> $env:GITHUB_ENV
      - name: Mutation tests
        env:
          MUTATION_MAX: ${{ inputs.max || '0' }}
        run: python tools/mutate.py --jobs 4 --max "$env:MUTATION_MAX" --report survivors.txt --json-report mutation-result.json
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence
          path: |
            mutation-result.json
            survivors.txt
          if-no-files-found: warn
          retention-days: 30
